name: CI

on:
  push:
    branches: [main, "feat/**", "chore/**"]
    paths-ignore: ["docs/**", "**/*.md", "legacy-ps/**", "LICENSE"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md", "legacy-ps/**", "LICENSE"]
  workflow_dispatch:

# A new push to the same branch cancels the run still going for the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    # Windows only until Nico says otherwise (docs/PORTING_LATER.md lists what is left out for Mac/Linux).
    name: build + test (windows)
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj
      - run: dotnet build videoprep.slnx -c Release
      # Integration tests (real ffmpeg) live in integration.yml (only when Engine/Tools or their tests change, or by hand).
      - run: dotnet test videoprep.slnx -c Release --no-build --filter "Category!=Integration&Inestable!=si" --logger "trx" --results-directory TestResults
      - name: Report failed tests as annotations
        if: failure()
        shell: bash
        run: python3 .github/scripts/trx_annotations.py TestResults || python .github/scripts/trx_annotations.py TestResults
      - name: Upload test results and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-windows
          path: |
            TestResults/
            tests/*/bin/Release/net10.0/screenshots/
          if-no-files-found: ignore

  publish:
    name: publish win-x64
    needs: [build-test]
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj
      - run: dotnet publish src/Videoprep.App -c Release -r win-x64 -o dist/win-x64
      - name: Zip and SHA-256
        shell: pwsh
        run: |
          Compress-Archive -Path dist/win-x64/* -DestinationPath dist/videoprep-ci-win-x64.zip
          $h = (Get-FileHash dist/videoprep-ci-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$h  videoprep-ci-win-x64.zip" | Tee-Object dist/videoprep-ci-win-x64.zip.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: videoprep-win-x64
          path: |
            dist/videoprep-ci-win-x64.zip
            dist/videoprep-ci-win-x64.zip.sha256
