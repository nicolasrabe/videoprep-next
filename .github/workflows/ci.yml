name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet build videoprep.slnx -c Release
      # Integration tests (real ffmpeg/yt-dlp) are opt-in and run in their own job from phase 3.
      - run: dotnet test videoprep.slnx -c Release --no-build --filter "Category!=Integration" --logger "trx" --results-directory TestResults
      - name: Report failed tests as annotations
        if: failure()
        shell: bash
        run: python3 .github/scripts/trx_annotations.py TestResults || python .github/scripts/trx_annotations.py TestResults
      - name: Upload test results and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-${{ matrix.os }}
          path: |
            TestResults/
            tests/*/bin/Release/net10.0/screenshots/
          if-no-files-found: ignore

  integration:
    # Real ffmpeg on generated test videos (frame-exact cuts, the whole engine with the fake yt-dlp).
    # Never downloads from YouTube.
    name: integration (ubuntu, real ffmpeg)
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Install ffmpeg (Ubuntu's own build)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && ffmpeg -version | head -1
      # DIAGNOSTIC (WebM audio): the ffmpeg that videoprep downloads for the user (yt-dlp/FFmpeg-Builds), next to Ubuntu's.
      - name: Restore videoprep's ffmpeg build (cache)
        id: ffcache
        uses: actions/cache/restore@v6
        with:
          path: ~/ffmpeg-videoprep
          key: ffmpeg-ytdlp-linux64-v1
      - name: Download videoprep's ffmpeg build
        if: steps.ffcache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          mkdir -p ~/ffmpeg-videoprep && cd ~/ffmpeg-videoprep
          curl -sSL --retry 3 -o ff.tar.xz "https://github.com/yt-dlp/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-linux64-gpl.tar.xz"
          tar -xJf ff.tar.xz --strip-components=1 && rm -f ff.tar.xz
      - name: Save the ffmpeg cache
        if: always() && steps.ffcache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/ffmpeg-videoprep
          key: ffmpeg-ytdlp-linux64-v1
      - name: Diagnostic settings
        run: |
          mkdir -p "$RUNNER_TEMP/diag"
          echo "VIDEOPREP_DIAG_DIR=$RUNNER_TEMP/diag" >> "$GITHUB_ENV"
          list="apt=/usr/bin"
          [ -x "$HOME/ffmpeg-videoprep/bin/ffmpeg" ] && list="$list;app=$HOME/ffmpeg-videoprep/bin"
          echo "VIDEOPREP_DIAG_FFMPEGS=$list" >> "$GITHUB_ENV"
          echo "$list"
      - run: dotnet build videoprep.slnx -c Release
      - run: dotnet test tests/Videoprep.Core.Tests -c Release --no-build --filter "Category=Integration" --logger "trx" --results-directory TestResults
      - name: Report failed tests as annotations
        if: failure()
        run: python3 .github/scripts/trx_annotations.py TestResults
      - name: WebM audio diagnostic (both ffmpeg builds)
        if: always()
        run: bash tests/ci/webm-diagnostic.sh "$VIDEOPREP_DIAG_DIR"
      # Trial only: the same integration tests with videoprep's ffmpeg. It does not change this job's result.
      - name: Trial - integration tests with videoprep's ffmpeg
        id: apptests
        if: always()
        continue-on-error: true
        env:
          VIDEOPREP_DIAG_DIR: ""
        run: |
          export VIDEOPREP_FFMPEG_DIR="$HOME/ffmpeg-videoprep/bin"
          test -x "$VIDEOPREP_FFMPEG_DIR/ffmpeg"
          dotnet test tests/Videoprep.Core.Tests -c Release --no-build --filter "Category=Integration" --logger "trx" --results-directory TestResultsApp
      - name: Trial result
        if: always()
        run: |
          echo "::notice title=TRIAL app ffmpeg::integration tests with videoprep's ffmpeg: ${{ steps.apptests.outcome }}"
      - name: Report the trial's failed tests as annotations
        if: always() && steps.apptests.outcome == 'failure'
        run: python3 .github/scripts/trx_annotations.py TestResultsApp

  publish:
    name: publish ${{ matrix.rid }}
    needs: [build-test, integration]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [win-x64, osx-arm64]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet publish src/Videoprep.App -c Release -r ${{ matrix.rid }} -o dist/${{ matrix.rid }}
      - name: Zip and SHA-256
        run: |
          cd dist/${{ matrix.rid }}
          zip -9 ../videoprep-ci-${{ matrix.rid }}.zip *
          cd ..
          sha256sum videoprep-ci-${{ matrix.rid }}.zip | tee videoprep-ci-${{ matrix.rid }}.zip.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: videoprep-${{ matrix.rid }}
          path: |
            dist/videoprep-ci-${{ matrix.rid }}.zip
            dist/videoprep-ci-${{ matrix.rid }}.zip.sha256
