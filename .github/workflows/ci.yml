name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet build videoprep.slnx -c Release
      # Integration tests (real ffmpeg/yt-dlp) are opt-in and run in their own job from phase 3.
      # Avalonia's headless test runner sometimes fails while cleaning up after a screen test ("different thread owns it", in the
      # runner's own code, not in videoprep's). A real failure fails twice; this one does not. The first failure stays in the log.
      - run: dotnet test videoprep.slnx -c Release --no-build --filter "Category!=Integration" --logger "trx" --results-directory TestResults || dotnet test videoprep.slnx -c Release --no-build --filter "Category!=Integration" --logger "trx" --results-directory TestResults2
      - name: Report failed tests as annotations
        if: failure()
        shell: bash
        run: python3 .github/scripts/trx_annotations.py TestResults TestResults2 || python .github/scripts/trx_annotations.py TestResults TestResults2
      - name: Upload test results and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-${{ matrix.os }}
          path: |
            TestResults/
            tests/*/bin/Release/net10.0/screenshots/
          if-no-files-found: ignore

  integration:
    # Real ffmpeg on generated test videos (frame-exact cuts, the whole engine with the fake yt-dlp).
    # Never downloads from YouTube.
    name: integration (ubuntu, real ffmpeg)
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      # The integration tests use the same ffmpeg build that videoprep downloads for its users (yt-dlp/FFmpeg-Builds, the Linux
      # twin of the Windows build), not Ubuntu's own package: Ubuntu's ffmpeg 8.0.1 prints "Error parsing Opus packet header"
      # when it READS our WebM audio (docs/VERIFY.md), the videoprep build never does. The download is cached.
      # To take a newer build, change the number at the end of the cache key.
      - name: Restore videoprep's ffmpeg build (cache)
        id: ffcache
        uses: actions/cache/restore@v6
        with:
          path: ~/ffmpeg-videoprep
          key: ffmpeg-ytdlp-linux64-v1
      - name: Download videoprep's ffmpeg build
        if: steps.ffcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/ffmpeg-videoprep && cd ~/ffmpeg-videoprep
          curl -sSL --retry 3 --fail -o ff.tar.xz "https://github.com/yt-dlp/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-linux64-gpl.tar.xz"
          tar -xJf ff.tar.xz --strip-components=1 && rm -f ff.tar.xz
      - name: Save the ffmpeg cache
        if: steps.ffcache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/ffmpeg-videoprep
          key: ffmpeg-ytdlp-linux64-v1
      - name: Use videoprep's ffmpeg for the tests
        run: |
          test -x "$HOME/ffmpeg-videoprep/bin/ffmpeg" && test -x "$HOME/ffmpeg-videoprep/bin/ffprobe"
          echo "VIDEOPREP_FFMPEG_DIR=$HOME/ffmpeg-videoprep/bin" >> "$GITHUB_ENV"
          "$HOME/ffmpeg-videoprep/bin/ffmpeg" -version | head -1
      - run: dotnet build videoprep.slnx -c Release
      - run: dotnet test tests/Videoprep.Core.Tests -c Release --no-build --filter "Category=Integration" --logger "trx" --results-directory TestResults
      - name: Report failed tests as annotations
        if: failure()
        run: python3 .github/scripts/trx_annotations.py TestResults

  publish:
    name: publish ${{ matrix.rid }}
    needs: [build-test, integration]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [win-x64, osx-arm64]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet publish src/Videoprep.App -c Release -r ${{ matrix.rid }} -o dist/${{ matrix.rid }}
      - name: Zip and SHA-256
        run: |
          cd dist/${{ matrix.rid }}
          zip -9 ../videoprep-ci-${{ matrix.rid }}.zip *
          cd ..
          sha256sum videoprep-ci-${{ matrix.rid }}.zip | tee videoprep-ci-${{ matrix.rid }}.zip.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: videoprep-${{ matrix.rid }}
          path: |
            dist/videoprep-ci-${{ matrix.rid }}.zip
            dist/videoprep-ci-${{ matrix.rid }}.zip.sha256
