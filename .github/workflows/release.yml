name: Release

# Push a tag like v0.3.0 to build the release zip and create a GitHub release (a 0.x version, or one with a suffix like -rc.1,
# is always marked as a pre-release). videoprep's own updater reads this release: the zip must be named
# videoprep-<tag>-<rid>.zip and SHA256SUMS.txt must list it (the updater installs nothing it cannot check against that file).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet test videoprep.slnx -c Release --filter "Category!=Integration"
      - name: Publish and zip
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          # Windows only so far: nobody can test the macOS build yet (PORT_PLAN: macOS later). Mac and Linux builds do not install updates by themselves.
          for RID in win-x64; do
            dotnet publish src/Videoprep.App -c Release -r "$RID" -o "dist/$RID" -p:VersionPrefix="$VER" -p:VersionSuffix=
            (cd "dist/$RID" && zip -9 "../videoprep-$TAG-$RID.zip" *)
            # The updater takes videoprep.exe out of the zip and nothing else: the zip holds that file only.
            test "$(unzip -Z1 "dist/videoprep-$TAG-$RID.zip")" = "videoprep.exe"
          done
      - name: SHA256SUMS.txt (the zips only) and check it
        run: |
          cd dist
          sha256sum videoprep-*.zip | tee SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq "$(ls videoprep-*.zip | wc -l)"
          sha256sum -c SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          PRE=""
          if [[ "$VER" == 0.* || "$VER" == *-* ]]; then PRE="--prerelease"; fi
          NOTES="docs/RELEASE_NOTES_${VER}.md"
          if [[ ! -f "$NOTES" ]]; then NOTES="CHANGELOG.md"; fi
          gh release create "$TAG" dist/videoprep-*.zip dist/SHA256SUMS.txt $PRE --title "videoprep ${VER}" --notes-file "$NOTES"
